name: 논문 PDF 빌드

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LaTeX 및 한글 글꼴 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-korean texlive-latex-extra \
            texlive-bibtex-extra texlive-science biber latexmk fonts-nanum fonts-nanum-coding fonts-noto-cjk

      - name: 델파이 분석 스크립트 테스트
        run: python3 -m unittest discover -s analysis -v

      - name: PDF 빌드 (논문 + 델파이 설문지)
        run: latexmk

      - name: PDF 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: |
            thesis.pdf
            survey/delphi-survey.pdf

      - name: 빌드 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            thesis.log
            survey/delphi-survey.log

      - name: 릴리스 생성 (v* 태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            thesis.pdf
            survey/delphi-survey.pdf
