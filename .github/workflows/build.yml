name: 논문 PDF 빌드

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LaTeX 및 한글 글꼴 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-korean texlive-latex-extra \
            texlive-bibtex-extra texlive-science biber latexmk fonts-nanum fonts-nanum-coding

      - name: PDF 빌드
        run: latexmk thesis.tex

      - name: PDF 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis.pdf

      - name: 빌드 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: thesis.log

      - name: 릴리스 생성 (v* 태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: thesis.pdf
